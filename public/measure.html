<!doctype html>
<html>
  <body>
    <iframe id="f" style="width: 390px; height: 900px; border: 0"></iframe>
    <pre id="out">pending</pre>
    <script>
      const frame = document.getElementById("f");
      const width = new URLSearchParams(location.search).get("w") || "390";
      frame.style.width = `${width}px`;
      frame.src = "/";
      frame.onload = () => {
        setTimeout(() => {
          const doc = frame.contentDocument;
          const win = frame.contentWindow;
          const selectors = [
            ".philosophy-intro",
            ".philosophy-intro h2",
            ".philosophy-copy",
            ".philosophy-grid",
            ".philosophy-card",
            ".philosophy-close",
            ".review",
            ".review-heading h2",
            ".review-card",
            ".cta",
            ".cta h2",
            ".cta-footer",
            ".review-toolbar",
            ".review-summary",
            ".review-controls",
          ];
          const rects = {};
          selectors.forEach((selector) => {
            const el = doc.querySelector(selector);
            if (!el) return;
            const r = el.getBoundingClientRect();
            rects[selector] = {
              x: Math.round(r.x),
              y: Math.round(r.y),
              w: Math.round(r.width),
              h: Math.round(r.height),
            };
          });
          const h2 = doc.querySelector(".cta h2");
          const lines = h2 ? Math.round(h2.getBoundingClientRect().height / parseFloat(win.getComputedStyle(h2).lineHeight)) : null;
          document.getElementById("out").textContent = JSON.stringify(
            { innerWidth: win.innerWidth, scrollWidth: doc.documentElement.scrollWidth, ctaHeadlineLines: lines, rects },
            null,
            2,
          );
        }, 1200);
      };
    </script>
  </body>
</html>
